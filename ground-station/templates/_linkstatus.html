{% if link.up %}
<span class="link-status link-online"
      hx-get="/partials/linkstatus"
      hx-trigger="every 3s"
      hx-swap="outerHTML">
  RHSI LINK ACTIVE
</span>
{% else %}
<span class="link-status link-offline"
      hx-get="/partials/linkstatus"
      hx-trigger="every 3s"
      hx-swap="outerHTML">
  LINK DOWN
</span>
<span style="
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    color: #4ad4d4;
    border: 1px solid #1a5555;
    background: #001a1a;
    padding: 2px 10px;
    animation: pulse-offline 2s ease-in-out infinite;"
      hx-get="/partials/linkstatus"
      hx-trigger="every 3s"
      hx-swap="outerHTML">
  ◆ AUTONOMOUS OPS ACTIVE
  {% if link.elapsed is not none %}
  &nbsp;·&nbsp; {{ link.elapsed }}s
  {% endif %}
</span>
<style>
  @keyframes pulse-offline {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.55; }
  }
</style>
{% endif %}
