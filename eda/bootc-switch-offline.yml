---
# bootc-switch-offline.yml — triggered by EDA on DDIL detection
# Stages the offline autonomous image and reboots into it.
- name: Switch satellite to offline autonomous mode
  hosts: localhost
  tasks:
    - name: Log DDIL event
      ansible.builtin.shell:
        cmd: logger -t satellite-eda "DDIL DETECTED — staging offline image for autonomous operation"

    - name: Stage offline satellite image
      ansible.builtin.command:
        cmd: bootc switch --target-no-signature-verification 192.168.122.1:5000/satellite-sim:offline
      become: true

    - name: Log pre-reboot
      ansible.builtin.shell:
        cmd: logger -t satellite-eda "Offline image staged — rebooting into autonomous mode"

    - name: Reboot into offline autonomous mode
      ansible.builtin.shell:
        cmd: "sleep 2 && systemctl reboot"
      async: 5
      poll: 0
      become: true
